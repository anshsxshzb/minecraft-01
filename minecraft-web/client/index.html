<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Web Sandbox</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: white; }
      #menu {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(0, 0, 0, 0.7); color: white; text-align: center;
      }
      #menu button { font-size: 1rem; padding: 0.8rem 1.4rem; cursor: pointer; }
      .hotbar { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 6px; }
      .hotbar-slot { width: 46px; height: 46px; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.4); display: grid; place-items: center; }
      .hotbar-slot.active { border-color: #ffd54a; }
      .crosshair {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 12px; height: 12px;
      }
      .crosshair::before, .crosshair::after { content: ''; position: absolute; background: white; }
      .crosshair::before { width: 12px; height: 2px; left: 0; top: 5px; }
      .crosshair::after { width: 2px; height: 12px; left: 5px; top: 0; }
      .stats { position: absolute; top: 10px; left: 10px; font-size: 0.9rem; text-shadow: 0 1px 2px black; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="menu">
      <div>
        <h1>Minecraft Web Sandbox</h1>
        <p>WASD move, space jump, left click break, right click place.</p>
        <button id="start-btn" type="button">Start Game</button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
